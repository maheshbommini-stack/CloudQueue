<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CloudQueue</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🎫 CloudQueue</h1>

    <p class="subtitle">
      Digital Token & Queue Management
    </p>

    <input
      type="text"
      id="name"
      placeholder="Name"
    >

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="registerBtn">
      Create Account
    </button>

    <button class="secondary" id="loginBtn">
      Login
    </button>

    <p id="message"></p>

  </div>

</div>

<script type="module" src="auth.js"></script>

</body>
</html>
